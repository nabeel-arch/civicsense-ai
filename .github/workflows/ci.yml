name: CI/CD
on:
  push:
    branches: [main]
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/civisense:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/civisense:${{ github.sha }}
  deploy:
    needs: build-push
    runs-on: self-hosted
    env:
      KUBECONFIG: /home/ubuntu/.kube/config
    steps:
      - name: Deploy to k3s
        run: |
          kubectl -n civicsense set image deployment/civicsense civicsense=${{ secrets.DOCKERHUB_USERNAME }}/civisense:${{ github.sha }}
          kubectl -n civicsense rollout status deployment/civicsense --timeout=180s
      - name: Notify Slack
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' --data "{\"text\":\"CivicSense deployed: image ${GITHUB_SHA::7} built, pushed to Docker Hub and rolled out on k3s\"}" "${{ secrets.SLACK_WEBHOOK_URL }}"
